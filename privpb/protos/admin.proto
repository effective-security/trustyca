// ListOrgsRequest specifies list orgs request
message ListOrgsRequest {
    // Limit specifies maximum number of records to return
    uint32 Limit = 1 [json_name = "Limit"];
    // Offset specifies offset for the offset-based pagination.
    // Which is limited to 10000.
    // To paginate for large number of records, use cursor-based pagination
    // instead.
    uint32 Offset = 2 [json_name = "Offset"];
    // Cursor specifies cursor for the cursor-based pagination.
    // Use "initial" to start the pagination or pass the cursor returned from
    // the previous request.
    string Cursor = 3 [json_name = "Cursor"];
    // Status specifies on optional status of the item to filter by.
    // If not specified, all items will be listed.
    pb.ItemStatus.Enum Status = 4 [json_name = "Status"];
}

// ListProjectsRequest specifies list projects request
message ListProjectsRequest {
    // Limit specifies maximum number of records to return
    uint32 Limit = 1 [json_name = "Limit"];
    // Offset specifies offset for the offset-based pagination.
    // Which is limited to 10000.
    // To paginate for large number of records, use cursor-based pagination
    // instead.
    uint32 Offset = 2 [json_name = "Offset"];
    // Cursor specifies cursor for the cursor-based pagination.
    // Use "initial" to start the pagination or pass the cursor returned from
    // the previous request.
    string Cursor = 3 [json_name = "Cursor"];
    // Status specifies on optional status of the item to filter by.
    // If not specified, all items will be listed.
    pb.ItemStatus.Enum Status = 4 [json_name = "Status"];
    // OrgID specifies optional org ID to filter by.
    string OrgID = 5 [json_name = "OrgID"];
}

// ListAllIssuersRequest specifies a paginated list of issuers across orgs
message ListAllIssuersRequest {
    // Limit specifies maximum number of records to return
    uint32 Limit = 1 [json_name = "Limit"];
    // Offset specifies offset for the offset-based pagination
    uint32 Offset = 2 [json_name = "Offset"];
    // Cursor specifies cursor for the cursor-based pagination.
    // Use "initial" to start the pagination or pass the cursor returned from
    // the previous request.
    string Cursor = 3 [json_name = "Cursor"];
    // OrgID limits the result to the org. Empty lists the issuers of every
    // org and of the platform, or of the platform only with Platform.
    string OrgID = 4 [json_name = "OrgID"];
    // Platform limits the result to the platform issuers (no org) when
    // OrgID is empty
    bool Platform = 5 [json_name = "Platform"];
    // ProjectID limits the result to the project; used with OrgID
    string ProjectID = 6 [json_name = "ProjectID"];
    // Label limits the result to the issuers with the label, in every scope
    // the list covers
    string Label = 7 [json_name = "Label"];
    // Status filters by lifecycle status; Unknown returns all
    pb.IssuerStatus.Enum Status = 8 [json_name = "Status"];
    // Type filters by authority type; Unknown returns all
    pb.AuthorityType.Enum Type = 9 [json_name = "Type"];
    // IDs limits the result to the issuers with the IDs, at most 500
    repeated string IDs = 10 [json_name = "IDs"];
    // IKIDs limits the result to the issuers with the key identifiers (the
    // SKID of the issuer, the IKID of the certificates it issued), at most
    // 500
    repeated string IKIDs = 11 [json_name = "IKIDs"];
}

// ListAllCertificatesRequest specifies a paginated list of certificates across
// orgs, newest first
message ListAllCertificatesRequest {
    // Limit specifies maximum number of records to return
    uint32 Limit = 1 [json_name = "Limit"];
    // Offset specifies offset for the offset-based pagination
    uint32 Offset = 2 [json_name = "Offset"];
    // Cursor specifies cursor for the cursor-based pagination.
    // Use "initial" to start the pagination or pass the cursor returned from
    // the previous request.
    string Cursor = 3 [json_name = "Cursor"];
    // OrgID limits the result to the org. Empty lists the certificates of
    // every org and of the platform, or of the platform only with Platform.
    string OrgID = 4 [json_name = "OrgID"];
    // Platform limits the result to the platform certificates (no org) when
    // OrgID is empty
    bool Platform = 5 [json_name = "Platform"];
    // ProjectID limits the result to the project; used with OrgID
    string ProjectID = 6 [json_name = "ProjectID"];
    // IKID filters by issuer
    string IKID = 7 [json_name = "IKID"];
    // Profile filters by profile label
    string Profile = 8 [json_name = "Profile"];
    // Status filters by status; Unknown returns all
    pb.CertificateStatus.Enum Status = 9 [json_name = "Status"];
    // ExpiringBefore filters certificates with NotAfter before the time,
    // in RFC3339 format
    string ExpiringBefore = 10 [json_name = "ExpiringBefore"];
}
