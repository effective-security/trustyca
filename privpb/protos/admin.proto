syntax = "proto3";
package privpb;

option go_package = "github.com/effective-security/trustyca/privpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "es/api/annotations.proto";
import "types.proto";
import "orgs.proto";

service Admin {
    // ListOrgs lists orgs
    rpc ListOrgs(ListOrgsRequest) returns (pb.OrgsResponse) {
        option (google.api.http) = {
            post: "/privpb.Admin/ListOrganizations",
            body: "*"
        };
        option (es.api.cli_cmd) = "org list";
    }

