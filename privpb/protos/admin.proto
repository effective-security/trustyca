package privpb;

option go_package = "github.com/effective-security/trustyca/privpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "es/api/annotations.proto";
import "types.proto";
import "orgs.proto";
import "pkix.proto";
import "ca.proto";

