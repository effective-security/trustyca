{{/* Shared partials for the test pages. "header" opens the document, "footer"
closes it. Every page passes the pageData value through: {{template "header" .}}
*/}} {{define "header"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}} · Trusty</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f5f6f8;
        color: #1d2330;
      }
      main {
        width: 100%;
        max-width: 440px;
        margin: 2rem 1rem;
        padding: 2rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0.5rem 0;
      }
      .muted {
        color: #6b7280;
        font-size: 0.9rem;
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin: 1.25rem 0;
      }
      button {
        font: inherit;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: 1px solid #cfd4dc;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #f0f2f5;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      button.primary:hover {
        background: #1d4ed8;
      }
      .status {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin: 1rem 0;
        word-break: break-all;
      }
      .status.error {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .status.ok {
        background: #f0fdf4;
        color: #166534;
        border: 1px solid #bbf7d0;
      }
      .status.info {
        background: #eff6ff;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
      }
      pre {
        padding: 0.75rem;
        background: #f3f4f6;
        border-radius: 8px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      details {
        margin-top: 1rem;
      }
      summary {
        cursor: pointer;
        color: #6b7280;
      }
      footer {
        margin-top: 1.5rem;
        color: #9ca3af;
        font-size: 0.8rem;
        text-align: center;
      }
      a {
        color: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #e5e7eb;
        }
        main {
          background: #1f2937;
          box-shadow: none;
        }
        button {
          background: #1f2937;
          border-color: #4b5563;
        }
        button:hover {
          background: #374151;
        }
        pre {
          background: #111827;
        }
        .muted,
        summary,
        footer {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {{end}} {{define "footer"}}
      <footer>Trusty test pages</footer>
    </main>
  </body>
</html>
{{end}}
