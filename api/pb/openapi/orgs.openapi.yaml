components:
    schemas:
        APIKey:
            type: object
            properties:
                ID:
                    type: string
                OrgID:
                    type: string
                ProjectID:
                    type: string
                Label:
                    type: string
                Key:
                    type: string
                Secret:
                    type: string
                Scopes:
                    type: array
                    items:
                        type: string
                Metadata:
                    type: array
                    items:
                        $ref: '#/components/schemas/KVPair'
                Status:
                    type: integer
                    format: enum
                CreatedAt:
                    type: string
                ExpiresAt:
                    type: string
                UsedAt:
                    type: string
                UsedCount:
                    type: integer
                    format: uint32
        APIKeyRequest:
            type: object
            properties:
                ProjectID:
                    type: string
                    description: |-
                        ProjectID is optional for project scope.
                         It must match the project of the API key.
                ID:
                    type: string
        APIKeysResponse:
            type: object
            properties:
                APIKeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/APIKey'
                NextPage:
                    allOf:
                        - $ref: '#/components/schemas/NextPage'
                    description: |-
                        NextPage specifies pagination information, if there are more pages to
                         fetch. If there are no more pages to fetch, NextPage will be empty.
        AddMemberRequest:
            type: object
            properties:
                Email:
                    type: string
                    description: Email specifies user email to search.
                Role:
                    type: integer
                    description: |-
                        Role specifies the role to grant. The caller must be allowed to grant
                         it at the requested scope; only an org Owner can grant Owner.
                    format: enum
                ProjectID:
                    type: string
                    description: |-
                        ProjectID specifies the project for a Project scope grant;
                         empty for an org-wide grant
            description: |-
                AddMemberRequest specifies request to grant a role in the org selected in
                 the token (empty ProjectID) or in a project.
                 If the user does not exist, an invite is created instead.
        AddMemberResponse:
            type: object
            properties:
                Invite:
                    $ref: '#/components/schemas/Invite'
                Membership:
                    $ref: '#/components/schemas/Membership'
            description: |-
                AddMemberResponse provides response for AddMember request.
                 If a user already exists, the Membership is returned.
                 If a user is invited, the Invite is returned.
        ChangeMemberRoleRequest:
            type: object
            properties:
                UserID:
                    type: string
                    description: UserID specifies user ID, if Email is empty
                Email:
                    type: string
                    description: Email specifies user email, if UserID is empty
                Role:
                    type: integer
                    format: enum
                ProjectID:
                    type: string
                    description: |-
                        ProjectID specifies the project for a Project scope grant;
                         empty for the org-wide grant
            description: |-
                ChangeMemberRoleRequest specifies request to change the role of an
                 existing grant at the requested scope
        CreateAPIKeyRequest:
            type: object
            properties:
                ProjectID:
                    type: string
                    description: |-
                        ProjectID is optional for project scope.
                         If not provided, will use Org scope for the current token.
                Label:
                    type: string
                Scopes:
                    type: array
                    items:
                        type: string
                ExpiresAt:
                    type: string
        DeleteInviteRequest:
            type: object
            properties:
                Email:
                    type: string
                ProjectID:
                    type: string
                    description: |-
                        ProjectID specifies the project for a Project scope invite;
                         empty for an org-wide invite
            description: |-
                DeleteInviteRequest specifies request to remove an invite at the given
                 scope
        DeleteMemberRequest:
            type: object
            properties:
                UserID:
                    type: string
                ProjectID:
                    type: string
                    description: |-
                        ProjectID specifies the project for a Project scope grant;
                         empty for the org-wide grant
            description: |-
                DeleteMemberRequest specifies request to remove a grant.
                 With ProjectID only the project grant is removed;
                 without ProjectID only the org-wide grant is removed.
        DeleteProjectRequest:
            type: object
            properties:
                ProjectID:
                    type: string
            description: DeleteProjectRequest specifies request to deactivate a project
        GetMembersRequest:
            type: object
            properties:
                ProjectID:
                    type: string
                    description: ProjectID limits the result to Project scope grants of the project
                Scope:
                    type: integer
                    description: Scope limits the result to Org scope grants when set to Org
                    format: enum
            description: |-
                GetMembersRequest specifies request to list members and invites of the
                 org selected in the token. Without ProjectID and Scope, grants of all
                 scopes are returned.
        GetProjectRequest:
            type: object
            properties:
                ProjectID:
                    type: string
                Alias:
                    type: string
            description: GetProjectRequest specifies a project by ID or alias
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        Invite:
            type: object
            properties:
                ID:
                    type: string
                OrgID:
                    type: string
                InviterID:
                    type: string
                Email:
                    type: string
                CreatedAt:
                    type: string
                Role:
                    type: integer
                    format: enum
                Scope:
                    type: integer
                    description: 'Scope of the invite: Org or Project'
                    format: enum
                ProjectID:
                    type: string
                    description: ProjectID is set for Project scope invites
                ExpiresAt:
                    type: string
                    description: ExpiresAt in RFC3339 format; expired invites grant nothing
            description: Invite provides an org or project invite
        KVPair:
            type: object
            properties:
                Key:
                    type: string
                    description: Key is a key of the pair
                Value:
                    type: string
                    description: Value is a value of the pair
            description: KVPair provides generic key-value pair
        ListAPIKeysRequest:
            type: object
            properties:
                ProjectID:
                    type: string
                    description: |-
                        ProjectID is optional for project scope.
                         If not provided, will use Org scope for the current token.
                Status:
                    type: integer
                    format: enum
        ListProjectsRequest:
            type: object
            properties:
                Status:
                    type: integer
                    description: Status filters by status; Unknown returns all
                    format: enum
                Limit:
                    type: integer
                    description: Limit specifies maximum number of records to return
                    format: uint32
                Offset:
                    type: integer
                    description: Offset specifies offset for the offset-based pagination
                    format: uint32
                Cursor:
                    type: string
                    description: Cursor specifies cursor for the cursor-based pagination
            description: ListProjectsRequest specifies a paginated list of projects
        MembersResponse:
            type: object
            properties:
                Memberships:
                    type: array
                    items:
                        $ref: '#/components/schemas/Membership'
                Invites:
                    type: array
                    items:
                        $ref: '#/components/schemas/Invite'
            description: MembersResponse provides list of members and invites
        Membership:
            type: object
            properties:
                ID:
                    type: string
                OrgID:
                    type: string
                OrgAlias:
                    type: string
                OrgName:
                    type: string
                UserID:
                    type: string
                Name:
                    type: string
                Email:
                    type: string
                Role:
                    type: integer
                    format: enum
                CreatedAt:
                    type: string
                Scope:
                    type: integer
                    description: 'Scope of the grant: Org or Project'
                    format: enum
                ProjectID:
                    type: string
                    description: ProjectID is set for Project scope grants
                ProjectAlias:
                    type: string
                ProjectName:
                    type: string
            description: |-
                Membership is an explicit role assignment (grant).
                 Org scope grant (empty ProjectID) is inherited by every project of the org.
                 Project scope grant applies to the project only; grants are additive.
        NextPage:
            type: object
            properties:
                Offset:
                    type: integer
                    description: |-
                        Offset is the offset of the next page for offset-based pagination.
                         Offset is limited to 10000.
                         To paginate for large number of records, use cursor-based pagination
                         instead.
                    format: uint32
                Cursor:
                    type: string
                    description: |-
                        Cursor is the cursor of the next page for cursor-based pagination.
                         Use "initial" to start the pagination or pass the cursor returned from
                         this response.
            description: NextPage specifies pagination information, if there are more pages to fetch.
        Org:
            type: object
            properties:
                ID:
                    type: string
                Alias:
                    type: string
                Name:
                    type: string
                Description:
                    type: string
                CreatedAt:
                    type: string
                Status:
                    type: integer
                    format: enum
        OrgAccess:
            type: object
            properties:
                OrgID:
                    type: string
                OrgAlias:
                    type: string
                OrgName:
                    type: string
                Role:
                    type: integer
                    description: |-
                        Role is the resolved org role: the explicit org-wide role, or Viewer
                         when the user only has project grants
                    format: enum
                RoleSource:
                    type: integer
                    description: RoleSource explains how Role was resolved
                    format: enum
                ExplicitRole:
                    type: integer
                    description: ExplicitRole is the explicit org-wide role, None when derived
                    format: enum
            description: OrgAccess provides the resolved access of a user to an org
        Project:
            type: object
            properties:
                ID:
                    type: string
                OrgID:
                    type: string
                Alias:
                    type: string
                    description: |-
                        Alias is a stable, org-unique identifier chosen by the client,
                         e.g. a cloud account ID or a slug
                Name:
                    type: string
                Description:
                    type: string
                Status:
                    type: integer
                    format: enum
                CreatedAt:
                    type: string
                UpdatedAt:
                    type: string
            description: Project owns a collection of resources governed by a common access policy
        ProjectsResponse:
            type: object
            properties:
                Projects:
                    type: array
                    items:
                        $ref: '#/components/schemas/Project'
                NextPage:
                    allOf:
                        - $ref: '#/components/schemas/NextPage'
                    description: |-
                        NextPage specifies pagination information, if there are more pages to
                         fetch. If there are no more pages to fetch, NextPage will be empty.
            description: ProjectsResponse returns list of projects
        RecordsResult:
            type: object
            properties:
                Created:
                    type: string
                Updated:
                    type: string
                Deleted:
                    type: string
            description: RecordsResult provides the number of created, updated and deleted records
        RegisterOrgRequest:
            type: object
            properties:
                Name:
                    type: string
                Description:
                    type: string
        RegisterProjectRequest:
            type: object
            properties:
                Alias:
                    type: string
                    description: Alias is org-unique; generated when empty
                Name:
                    type: string
                Description:
                    type: string
            description: |-
                RegisterProjectRequest specifies request to create a project in the org
                 selected in the token
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        UpdateOrgRequest:
            type: object
            properties:
                Name:
                    type: string
                Description:
                    type: string
            description: UpdateOrgRequest updates the org selected in the token
        UpdateProjectRequest:
            type: object
            properties:
                ProjectID:
                    type: string
                Name:
                    type: string
                Description:
                    type: string
            description: UpdateProjectRequest specifies request to update a project
        UserMemberships:
            type: object
            properties:
                Org:
                    allOf:
                        - $ref: '#/components/schemas/OrgAccess'
                    description: Org is the resolved org access
                Memberships:
                    type: array
                    items:
                        $ref: '#/components/schemas/Membership'
                    description: |-
                        Memberships are the caller's explicit grants in the org: the org-wide
                         grant (empty ProjectID) and one per project grant
            description: UserMemberships provides the caller's access to the selected org
        UserOrgsResponse:
            type: object
            properties:
                Orgs:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrgAccess'
            description: UserOrgsResponse provides the orgs the caller can select
tags:
    - name: Orgs
