openapi: 3.0.3
info:
    title: Auth API
    version: 0.0.1
paths:
    /pb.Auth/AuthenticateAPIKey:
        post:
            tags:
                - Auth
            description: |-
                AuthenticateAPIKey returns the user token info.
                 The caller must include the API key in the Authorization header
                 with HMAC SHA256 signature of the request, using API key secret.

                 Date: RFC3339 timestamp
                 Authorization: APIKey {KeyID}:{signature}
                 signature = Base64(HMAC-SHA256(secret, method + timestamp))
            operationId: Auth_AuthenticateAPIKey
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserTokenResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/Caller:
        post:
            tags:
                - Auth
            description: Caller returns the caller status.
            operationId: Auth_Caller
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CallerStatusResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/ExchangeCode:
        post:
            tags:
                - Auth
            description: |-
                ExchangeCode exchanges the one-time code for a token.
                 The returned token only contains the Access Token.
                 The client should call GetUserToken for full info.
            operationId: Auth_ExchangeCode
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExchangeCodeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Token'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/GetAllowedMethods:
        post:
            tags:
                - Auth
            description: GetAllowedMethods returns the allowed methods for the caller
            operationId: Auth_GetAllowedMethods
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ServiceAccessInfo'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/GetCallerScope:
        post:
            tags:
                - Auth
            description: |-
                GetCallerScope returns the caller's resolved scope in the selected org:
                 the org role, project roles, token scopes, and per method the roles
                 and scopes it requires.
            operationId: Auth_GetCallerScope
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CallerScope'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/GetProviders:
        post:
            tags:
                - Auth
            description: GetProviders returns the list of supported providers
            operationId: Auth_GetProviders
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuthProvidersRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthProvidersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/GetUserToken:
        post:
            tags:
                - Auth
            description: GetUserToken returns the user token info
            operationId: Auth_GetUserToken
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserTokenResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/RevokeToken:
        post:
            tags:
                - Auth
            description: RevokeToken revokes the user token
            operationId: Auth_RevokeToken
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /pb.Auth/SelectOrg:
        post:
            tags:
                - Auth
            description: |-
                SelectOrg verifies the caller's access to the org and returns a new
                 token scoped to it. This is the only tenant request that carries OrgID.
            operationId: Auth_SelectOrg
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SelectOrgRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
