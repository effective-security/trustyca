---
service:
  # specifies the service name (to be used in logs, metrics, etc)
  name: trustyca
  # specifies the Region / Datacenter where the instance is running
  region: dev
  # specifies the environment where the instance is running: prod|stage|dev
  environment: dev
  # specifies the cluster name
  cluster: local

log_levels:
  - repo: "*"
    level: TRACE
  - repo: github.com/effective-security/trustyca
    package: "*"
    level: TRACE
  - repo: github.com/effective-security/trustyca/internal
    package: "*"
    level: DEBUG
  - repo: github.com/effective-security/trustyca/server
    package: "*"
    level: DEBUG
  - repo: github.com/effective-security/trustyca/server/service
    package: "*"
    level: DEBUG

metrics:
  # specifies if the metrics provider is disabled
  disabled: false
  prefix: trustyca
  runtime_metrics: true
  allowed_prefixes:
    - trustyca
  blocked_prefixes:
    - promhttp
  # the metrics provider: prometheus|inmem
  provider: prometheus
  prometheus:
    expiration: 1m
    addr: "127.0.0.1:29090"

auth:
  auth_url: https://localhost:8880/v1/auth/authorize
  jwt_provider: ${TRUSTYCA_CONFIG_DIR}/jwt-provider.yaml
  oauth2_clients: ${TRUSTYCA_CONFIG_DIR}/oauth2_clients.yaml
  allowed_domains:
    - tbilicode.com
    - effectivesecurity.pt
  allowed_redirect_domains:
    - app.dev.trustyca.io
    - auth.dev.trustyca.io
    - app.local.trustyca.io
    - localhost
  # reCAPTCHA v3 site key for the /login page; leave empty to disable reCAPTCHA.
  # Not a secret: it is rendered into the page.
  recaptcha_site_key: ${TRUSTYCA_RECAPTCHA_SITE_KEY}

sql:
  # specifies the connection string. It can be prefixed with file:// or env:// to load the source from a file or environment variable.
  data_source: file://${TRUSTYCA_CONFIG_DIR}/sql-conn-trustycadb.txt
  # the directory that contains migrations.
  migrations_dir: ${TRUSTYCA_CONFIG_DIR}/../../sql/trustycadb/migrations

# aws:
#   endpoint:
#     region: us-west-2
#     profile: localstack
#     access_key:
#       id: notused
#       secret: notused
#     retries:
#       # retries specifies the map of internal service name to retry configuration
#       ebs:
#         max_attempts: 10
#         max_backoff_seconds: 10
#     services:
#       default: http://localhost:4566

cache:
  provider: redis
  redis:
    server: redis://localhost:56379
    password: redis
    client_tls:
      trusted_ca: ${HOME}/.trustyca/certs/trusty_root_ca.pem

orgs:
  default_org_name: Default
  default_project_name: Default

tasks:
  # - name: health_check
  #   schedule: "every 60 seconds"

servers:
  wfe:
    description: Web Front End service
    disabled: false
    listen_urls:
      - https://0.0.0.0:8880
    server_tls:
      cert: ${HOME}/.trustyca/certs/trustyca_server.pem
      key: ${HOME}/.trustyca/certs/trustyca_server.key
      trusted_ca: ${HOME}/.trustyca/certs/trusty_root_ca.pem
      client_cert_auth: false
    services:
      - status
      - auth
      - orgs
      - admin
      - ui
    timeout:
      request: 3s
    cors: &cors
      enabled: true
      max_age: 600
      allow_credentials: true
      allowed_origins:
        - "*"
      allowed_methods:
        - HEAD
        - OPTIONS
        - GET
        - POST
        - DELETE
      allowed_headers:
        - Accept
        - Content-Type
        - Content-Length
        - Accept-Encoding
        - Accept-Language
        - Authorization
        - User-Agent
        - Referer
        - X-Device-ID
        - Location
        - Link
        - Replay-Nonce
        - sec-ch-ua
        - sec-ch-ua-mobile
        - sec-fetch-dest
        - sec-fetch-mode
    # configuration for the authorization module
    authz:
      # allow any non-authenticated request access to this path and its children
      # /v1/* is allowed
      allow_any:
        - /
        - /favicon.ico
        - /v1
        - /metrics
        - /healthz
        - /pb.Status
        - /v1/webhooks
      # allow any authenticated request that includes a non empty role
      allow_any_role:
        - /pb.Orgs
      # allow the specified roles access to this path and its children, in format: ${path}:${role},${role}
      allow:
      - /privpb.Admin:trustyca-admin
      # specifies to log allowed access to Any role
      log_allowed_any: true
      # specifies to log allowed access
      log_allowed: true
      # specifies to log denied access
      log_denied: true
    # configuration for the Identity mappers
    identity_map:
      debug_logs: false
      strict: true
      skip_auth:
        - /
        - /favicon.ico
        - /healthz
        - /metrics
        - /login
        - /authenticated
        - /payment
        - /v1/auth/authorize
        - /v1/auth/callback
        - /v1/auth/done
        - /v1/auth/providers
        - /v1/auth/removecookie
        - /v1/status/node
        - /v1/status/server
        - /v1/status/version
        - /v1/webhooks/stripe
      cookies:
        auth: avn_trustyca_access_token
        csrf: avn_trustyca_csrf_token
        domain: .local.trustyca.io
      jwt:
        enabled: true
        issuer: https://localhost:8880
        audience: https://localhost:8880
        default_authenticated_role: user
        subject_claim: sub
        tenant_claim: org
        role_claim: email
      jwt_dpop:
        enabled: true
        issuer: https://localhost:8880
        audience: https://localhost:8880
        default_authenticated_role: user
        subject_claim: sub
        tenant_claim: org
        role_claim: email
        roles:
          trustyca-admin:
            - denis@tbilicode.com
            - denis@effectivesecurity.pt
          # trustyca-viewer:

  backend:
    description: Backend service
    disabled: false
    listen_urls:
      - https://0.0.0.0:8881
    server_tls:
      cert: ${HOME}/.trustyca/certs/trustyca_peer.pem
      key: ${HOME}/.trustyca/certs/trustyca_peer.key
      trusted_ca: ${HOME}/.trustyca/certs/trusty_root_ca.pem
      client_cert_auth: false
    services:
      - status
      - auth
      - admin
    timeout:
      request: 3s
    cors: *cors
    # configuration for the authorization module
    authz:
      # allow any non-authenticated request access to this path and its children
      # /v1/* is allowed
      allow_any:
        - /
        - /favicon.ico
        - /v1
        - /metrics
        - /healthz
        - /pb.Status
      # allow any authenticated request that includes a non empty role
      allow_any_role:
      # allow the specified roles access to this path and its children, in format: ${path}:${role},${role}
      allow:
        - /privpb.Admin:trustyca-admin,trustyca-peer
      # specifies to log allowed access to Any role
      log_allowed_any: true
      # specifies to log allowed access
      log_allowed: true
      # specifies to log denied access
      log_denied: true
    # configuration for the Identity mappers
    identity_map:
      debug_logs: false
      strict: true
      tls:
        default_authenticated_role: user
        roles:
          trustyca-peer:
            - spiffe://trustyca/peer
          trustyca-client:
            - spiffe://trustyca/client
          trustyca-admin:
            - spiffe://trustyca/admin

client:
  client_tls:
    cert: ${HOME}/.trustyca/certs/trustyca_client.pem
    key: ${HOME}/.trustyca/certs/trustyca_client.key
    trusted_ca: ${HOME}/.trustyca/certs/trusty_root_ca.pem
  server_url:
    wfe: http://localhost:8880
    backend: http://localhost:8881
  dial_timeout: 30s
  dial_keep_alive_time: 300s
  dial_keep_alive_timeout: 30s
