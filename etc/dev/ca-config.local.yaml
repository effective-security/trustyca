---
authority:
  ca_bundles:
    - ${HOME}/.trustyca/certs/trustyca_cabundle.pem
  root_bundles:
    - ${HOME}/.trustyca/certs/trustyca_root.pem
  issuers:
    - # the platform intermediate (path length 1) that signs the issuing CAs
      # of the orgs: `trustycactl ca org bootstrap --parent trusty.l1`
      label: trusty.l1
      # specifies type: tls|codesign|timestamp|ocsp|spiffe|trusty
      type: trusty
      cert: ${HOME}/.trustyca/certs/trustyca_l1_ca.pem
      key: ${HOME}/.trustyca/certs/trustyca_l1_ca.key
      # location of the CA bundle file
      ca_bundle:
      # location of the Root CA file
      root_bundle:
      allowed_profiles:
        - ocsp
        - tenant_ca
      aia:
        issuer_url: http://localhost:8880/v1/cert/:ISSUER_ID
        crl_url: http://localhost:8880/v1/crl/:ISSUER_ID
        ocsp_url: http://localhost:8880/v1/ocspi/:ISSUER_ID
        crl_expiry: 48h
        crl_renewal: 12h
        ocsp_expiry: 1h
        delegated_ocsp_profile: ocsp
    - # specifies Issuer's label
      label: trusty.svc
      # specifies type: tls|codesign|timestamp|ocsp|spiffe|trusty
      type: trusty
      cert: ${HOME}/.trustyca/certs/trustyca_l2_ca.pem
      key: ${HOME}/.trustyca/certs/trustyca_l2_ca.key
      # location of the CA bundle file
      ca_bundle:
      # location of the Root CA file
      root_bundle:
      allowed_profiles:
        - ocsp
      aia:
        issuer_url: http://localhost:8880/v1/cert/:ISSUER_ID
        crl_url: http://localhost:8880/v1/crl/:ISSUER_ID
        ocsp_url: http://localhost:8880/v1/ocspi/:ISSUER_ID
        crl_expiry: 48h
        crl_renewal: 12h
        ocsp_expiry: 1h
        delegated_ocsp_profile: ocsp

# profile:
#
# description: string
# expiry: duration
# backdate: duration
# usages: []string
# ocsp_no_check: bool
# allowed_extensions: []string
# allowed_names: regex
# allowed_dns: regex
# allowed_email: regex
# allowed_fields:
#   subject: bool
#   dns: bool
#   ip: bool
#   email: bool
#   email: uri
# policies: []
#   oid:
#   qualifiers:
# ca_constraint:
#   is_ca:
#   max_path_len:
#
profiles:
  default:
    issuer_label: trusty.svc
    expiry: 168h
    backdate: 30m
    usages:
      - signing
      - key encipherment
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 2.5.29.17 # SAN

  test_server:
    description: test server profile
    issuer_label: trusty.svc
    expiry: 5m
    backdate: 30m
    usages: # provides a list key usages
      - signing
      - key encipherment
      - server auth
      - ipsec end system
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 2.5.29.17 # SAN

  test_client:
    description: test client profile
    issuer_label: trusty.svc
    expiry: 5m
    backdate: 30m
    usages:
      - signing
      - key encipherment
      - client auth
      - ipsec user
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 2.5.29.17 # SAN

  peer:
    issuer_label: trusty.svc
    expiry: 168h
    backdate: 30m
    usages:
      - signing
      - key encipherment
      - server auth
      - client auth
      - ipsec user
      - ipsec end system
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 2.5.29.17 # SAN
    allowed_uri: ^spiffe://trusty/.*$
    allowed_fields:
      uri: true

  server:
    issuer_label: trusty.svc
    expiry: 168h
    backdate: 30m
    usages:
      - signing
      - key encipherment
      - server auth
      - ipsec end system
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 2.5.29.17 # SAN

  client:
    issuer_label: trusty.svc
    expiry: 168h
    backdate: 30m
    usages:
      - signing
      - key encipherment
      - client auth
      - ipsec user
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 2.5.29.17 # SAN
    allowed_uri: ^spiffe://trusty/.*$
    allowed_fields:
      uri: true

  tenant_ca:
    description: Issuing CA of an org, signed by the platform intermediate
    issuer_label: "*"
    expiry: 43800h
    backdate: 30m
    usages:
      - cert sign
      - crl sign
    ca_constraint:
      is_ca: true
      max_path_len: 0

  ocsp:
    description: Delegated OCSP responder profile
    issuer_label: "*"
    expiry: 168h
    backdate: 30m
    usages:
      - ocsp signing
    ocsp_no_check: true
    allowed_extensions:
      - 1.3.6.1.5.5.7.1.1 # AIA
      - 1.3.6.1.5.5.7.48.1.5 # OCSP no check

  timestamp:
    description: Timestamp certificate profile
    issuer_label: trusty.svc
    expiry: 43070h
    backdate: 30m
    usages:
      - digital signature
      - timestamping
    allowed_extensions:
      - 2.5.29.37

  codesign:
    description: Codesigning certificate profile
    issuer_label: trusty.svc
    expiry: 8760h
    backdate: 30m
    usages:
      - digital signature
      - code signing
      - key encipherment

